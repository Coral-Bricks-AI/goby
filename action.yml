name: goby review
description: AI code review with a separate fail-closed merge eligibility gate
author: CoralBricks

branding:
  icon: eye
  color: teal

inputs:
  provider:
    description: Model provider (coral, openai).
    default: coral
  model:
    description: Model name; empty uses the provider default.
    default: ""
  base-url:
    description: Override the provider endpoint.
    default: ""
  github-token:
    description: Token used to read the PR and post reviews/statuses.
    default: ${{ github.token }}
  pr-number:
    description: PR number; required explicitly for workflow_run or workflow_dispatch.
    default: ${{ github.event.pull_request.number }}
  expected-head:
    description: Exact head SHA; stale workflows refuse to review or gate a newer head.
    default: ${{ github.event.pull_request.head.sha }}
  mode:
    description: review (model + gate) or gate (refresh eligibility without a model).
    default: review
  fail-on-blocked:
    description: In review mode, fail the job unless Goby Gate passes. Gate mode always fails closed.
    default: "true"
  max-tool-turns:
    description: Model turns that may still call a tool.
    default: "25"
  wall-timeout:
    description: Whole-review model budget in seconds.
    default: "1200"

runs:
  using: composite
  steps:
    - name: Set up Bun for the trusted source build
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.4"
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Build pinned Goby source
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cd "$ACTION_PATH"
        bun install --frozen-lockfile --ignore-scripts
        bun run build

    # Build only this caller-pinned action. No package, checkout, dependency,
    # or executable from the pull request is used.
    - name: Review or refresh gate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GOBY_PROVIDER: ${{ inputs.provider }}
        GOBY_MAX_TOOL_TURNS: ${{ inputs.max-tool-turns }}
        GOBY_WALL_TIMEOUT: ${{ inputs.wall-timeout }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_PR: ${{ inputs.pr-number }}
        INPUT_HEAD: ${{ inputs.expected-head }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL: ${{ inputs.fail-on-blocked }}
      # Validation lives in the entrypoint, so a bad input fails before any network call and
      # never reaches a URL, a git ref or a shell.
      run: node "$ACTION_PATH/dist/main.js"


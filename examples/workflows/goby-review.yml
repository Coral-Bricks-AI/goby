# Goby Review — the workflow to copy into your repository.
#
# Trusted source only: this job fetches the goby action at a pinned commit and never checks out,
# imports or executes anything from the pull request. Nothing here needs a container.
#
# Two things to change:
#   1. `Coral-Bricks-AI/goby@<GOBY_COMMIT_SHA>` — the full commit SHA you reviewed. Get it with
#      `git ls-remote https://github.com/Coral-Bricks-AI/goby.git refs/heads/main`. A tag would be
#      a movable handle over executable code; the SHA is what makes this a trusted source.
#   2. The secret name, if you are not using the Coral gateway.
#
# Then: add `CORALBRICKS_API_KEY` as a repository secret, and require **Goby Gate** plus CI in
# branch protection. Not Goby Review — that status is execution telemetry.
#
# Same-repository pull requests only. Fork PRs have no secrets, so the `if:` below skips them
# instead of failing; see docs/trust-model.md for what reviewing forks would take.

name: Goby review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: goby-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: Coral-Bricks-AI/goby@<GOBY_COMMIT_SHA>
        with:
          provider: coral
          model: ""
        env:
          CORALBRICKS_API_KEY: ${{ secrets.CORALBRICKS_API_KEY }}

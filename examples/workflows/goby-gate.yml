# Goby gate recheck — copy into `.github/workflows/`.
#
# The gate answers one question: is the evidence on this pull request still sufficient for the
# current head? It makes no model call, needs no key, and clones nothing — so it is safe to run
# whenever CI finishes, and cheap enough to do so on every completion.
#
# Runs `:latest`, same as the reviewer, so it checks evidence with the code that wrote it.
# Must exist on the default branch: a workflow_run handoff has to come from trusted code.
# `pull_request_target` is not used here and must not be: nothing from the pull request is read.

name: Goby gate recheck

on:
  workflow_run:
    workflows: [Goby review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      head:
        description: Full current PR head SHA
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write
  packages: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/coral-bricks-ai/goby-review:latest
    env:
      # Which pull request this is about comes from the event file, resolved in the image rather
      # than by a script inlined here. See src/core/gateEvent.ts.
      GOBY_MODE: gate
      GOBY_REPO: ${{ github.repository }}
      GOBY_EVENT_FILE: ${{ github.event_path }}
      GOBY_PR: ${{ inputs.pr }}
      GOBY_HEAD: ${{ inputs.head }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recheck eligibility
        run: /opt/goby/entrypoint.sh

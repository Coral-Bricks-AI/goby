name: test code image

# Same reasoning as test-review-image.yml: code/Dockerfile is otherwise only built by the push to
# main that publishes it, so a broken build would first fail on the branch everyone already runs.
# Build it on the pull request that changes it instead.
#
# Not on push to main: code-image.yml already builds these two images on that push.

on:
  pull_request:
    paths:
      - "base/**"
      - "code/**"
      - "common/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-code-image.yml"
      - ".github/workflows/code-image.yml"

concurrency:
  group: test-code-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same two builds code-image.yml publishes. Plain `docker build`, not buildx: code/ is
      # built `FROM` the base image just built, and a container driver cannot see an image that
      # only exists in the daemon.
      - name: Build goby-base
        run: docker build --platform linux/amd64 -t goby-base:test base

      - name: Build the code image
        run: >-
          docker build --platform linux/amd64 --build-arg BASE_IMAGE=goby-base:test
          -f code/Dockerfile -t goby-code:test .

      # A build that succeeds but cannot start is the failure mode that only shows up on the first
      # real run.
      - name: The image can start
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash goby-code:test -lc \
            'pi --version && node --version && python3 --version && git --version && jq --version && rg --version | head -1'

      # report_done.ts is copied as source and loaded by pi at run time, same reasoning as
      # test-review-image.yml's "the emit extension loads": a syntax error would pass every build
      # and then fail every run, because the tool the agent must call to end the run would never be
      # there to call.
      - name: The completion extension loads
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -e GOBY_MAX_TURNS=50 -e GOBY_MAX_TOOL_CALLS=80 -e GOBY_BASH_TIMEOUT_S=120 \
            -e GOBY_AGENT_TIMEOUT_S=600 \
            -e GOBY_AGENT_OUT=/tmp/agent \
            --entrypoint bash goby-code:test -lc \
              'pi --mode json --extension /opt/goby/report_done.ts "hi" 2>&1 || true' \
            | grep -Ei 'failed to load extension|is required' || true)"
          if [[ -n "$out" ]]; then echo "$out" >&2; exit 1; fi

      - name: Missing required inputs fail loudly, not silently
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint bash goby-code:test -lc '/opt/goby/entrypoint.sh 2>&1 || true')"
          case "$out" in
            *"missing required input"*) echo "$out" ;;
            *) echo "unexpected output: $out" >&2; exit 1 ;;
          esac

      # Same reasoning as the reviewer's version of this check: a toolchain the task under code
      # might need belongs in the sandbox it builds, fetched there like any other dependency, not
      # baked into the harness image.
      - name: The image is still the harness, not a toolchain
        run: |
          set -euo pipefail
          if found="$(docker run --rm --entrypoint bash goby-code:test -lc 'command -v bun || command -v git-lfs')"; then
            echo "the code image ships $found; a repo that needs it installs it in the sandbox" >&2
            exit 1
          fi

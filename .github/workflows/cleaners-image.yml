name: cleaners image

# Builds the cleaner image every other workflow runs, and prints the digest to pin.
#
# The digest, not the tag: `ghcr.io/coral-bricks-ai/goby-cleaners:latest` is a moving handle,
# and a scan's findings are only comparable across weeks if the container that produced them
# is the same one. Copy the `@sha256:...` from this job's summary into your workflow.

on:
  push:
    branches: [main]
    paths:
      - "cleaners/**"
      - ".github/workflows/cleaners-image.yml"
    tags: ["cleaners-v*"]
  workflow_dispatch:

concurrency:
  group: cleaners-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/coral-bricks-ai/goby-cleaners

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - name: Harness tests
        working-directory: cleaners
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=cleaners-v(.*),group=1

      # amd64 only: it is what `ubuntu-latest` is, and it is what a container job pulls. A
      # multi-arch build would double the build time for the one platform nobody runs a scan
      # on. An arm64 runner can rebuild this context in one step.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: cleaners
          file: cleaners/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print the digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "error: the build produced no digest" >&2
            exit 1
          fi
          echo "### $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "image $IMAGE@$DIGEST"

# One-off smoke test for issue #220: a manual trigger that runs the new `code/` kind against a
# real task (issue #184) in this repository, to confirm it opens a scoped pull request end to end
# before #220 is closed. Delete this file once that PR exists — it is not part of the kind itself.
name: Dogfood code kind on #184

on:
  workflow_dispatch: {}

jobs:
  run:
    # A reusable-workflow caller that sets no permissions hands the called job the repository's
    # default GITHUB_TOKEN permissions (read-only here), and a called workflow may only narrow
    # that, never elevate it. Without this, goby-code.yml's contents:write/pull-requests:write
    # requests are capped at read, every git-data write 403s, and the smoke test opens nothing.
    permissions:
      contents: write
      pull-requests: write
      packages: read
    uses: ./.github/workflows/goby-code.yml
    with:
      task: .goby/tasks/fix-184.md
      allowed_paths: cleaners/cleaner.sh
    secrets: inherit

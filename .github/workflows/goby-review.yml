# Goby Review on goby itself — the same file consumers copy.
#
# The reviewer clones the pull request, runs in a container as an unprivileged user, and can use a
# shell against the change: it may run your tests, write a probe, patch a line and re-run. The
# process that can write to the pull request is a different user, in the same container, holding
# the token; the model key lives in a root-only file behind a loopback proxy, so neither is in the
# environment of the code being reviewed.
#
# Two things to change:
#   1. `provider:`/`model:` if you are not using the Coral gateway, and the matching secret.
#   2. Nothing else. `permissions:` is the whole grant: the reviewed code runs without the token.
#
# The image runs `:latest` and every review names the digest it resolved, so a finding stays
# attributable after the tag moves. Pin a digest instead if you would rather have immutable bytes.
#
# Use `pull_request`, never `pull_request_target`: the latter runs from the base branch with
# secrets present, and this job then executes code from the pull request.
#
# Same-repository pull requests only. Fork PRs get no secrets, so the `if:` below skips them
# instead of failing. See docs/trust-model.md.

name: Goby review

on:
  pull_request:
    # `labeled`/`unlabeled` are here so adding `no-review` skips an open pull request and removing
    # it starts the review: `gh pr create --label` adds the label after `opened` fires, and without
    # `unlabeled` a pull request that loses the label is never picked up again.
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  packages: read

concurrency:
  group: goby-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are not reviewed: a pull request under construction should not pay three minutes and a
    # model call per push. The same applies to `no-review`, which is the label to reach for when a
    # change cannot be reviewed by the thing it is changing.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'no-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # `&goby_image` is the one place the image is named: `GOBY_IMAGE` below is an alias, so a pin
      # cannot change the reported digest without changing the image that runs, or the reverse.
      image: &goby_image ghcr.io/coral-bricks-ai/goby-review:latest
    env:
      GOBY_REPO: ${{ github.repository }}
      GOBY_PR: ${{ github.event.pull_request.number }}
      GOBY_HEAD: ${{ github.event.pull_request.head.sha }}
      GOBY_BASE: ${{ github.event.pull_request.base.sha }}
      GOBY_PROVIDER: coral
      GOBY_MODEL: deepseek-v4.1-flash-fast
      # Budgets — turns, tool calls, the bash timeout, the diff cap, the finding cap and the number
      # of reviews per pull request — are image defaults in review/defaults.env. Set one here only
      # to override it for this repository.
      # Alias of `container.image` above — edit the anchor, not this line, or the review would
      # report a digest for an image it did not run.
      GOBY_IMAGE: *goby_image
      # The gate is the second status ("Goby Gate"), an eligibility verdict recomputed from GitHub
      # state with no model involved. Turn it on when branch protection requires it; off, the review
      # posts its findings and claims nothing about merging.
      GOBY_GATE: "off"
    steps:
      # A container job ignores the image's ENTRYPOINT — GitHub keeps its own — so the step names
      # it. Everything else (clone, sandbox, agent, publish) happens inside. The two secrets are
      # step-scoped, not job-scoped: a job-level env is part of the container's own environment,
      # and these belong to the one process that needs them (as in cleaners).
      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORALBRICKS_API_KEY: ${{ secrets.CORALBRICKS_API_KEY }}
        run: /opt/goby/entrypoint.sh

name: review image

# Publishes the two images the reviewer runs from, and prints the digests to pin.
#
# Two tags, two digests: `goby-base` is what `cleaners/` and `review/` build on, and
# `goby-review` is what the workflow points at. Pin the review digest in the workflow — a tag is
# a movable handle, and the bytes a review runs are the product.

on:
  push:
    branches: [main]
    paths:
      - "base/**"
      - "review/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/review-image.yml"
    tags: ["review-v*"]
  workflow_dispatch:

concurrency:
  group: review-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # to push the pin branch
  pull-requests: write   # to open and merge the pin pull request
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: it is what `ubuntu-latest` is, and a container job pulls what the runner can
      # execute. An arm64 consumer can rebuild this context in one step.
      - name: Build goby-base
        run: docker build --platform linux/amd64 -t base:local base

      - name: Build the reviewer
        run: docker build --platform linux/amd64 --build-arg BASE_IMAGE=base:local -f review/Dockerfile -t review:local .

      - name: Publish both, and print what to pin
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=12 HEAD)"
          publish() {
            local local_image="$1" name="$2"
            local image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name}"
            docker tag "$local_image" "$image:$SHA"
            docker tag "$local_image" "$image:latest"
            docker push --quiet "$image:$SHA"
            docker push --quiet "$image:latest"
            local digest
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$SHA")"
            # The digest, not the tag: it is the only thing a consumer can pin that cannot move.
            { echo "### $name — pin this"; echo '```'; echo "$digest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$name -> $digest"
          }
          publish base:local goby-base
          publish review:local goby-review

      # The reviewer pins its own image by digest, so every publish is a one-line commit. Doing it
      # by hand is the step everyone forgets, and a stale pin means goby's own reviews run code that
      # is no longer what main says. A pull request rather than a push keeps the branch rule, and
      # the `no-review` label keeps the reviewer from reviewing its own digest bump.
      - name: Bump the pinned digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read the digest back from the image we just pushed rather than threading it through an
          # output: the tag is what the push created, and the digest is what the tag now means.
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/goby-review:$(git rev-parse --short=12 HEAD)")"
          FILE=.github/workflows/goby-review.yml
          if grep -q "$DIGEST" "$FILE"; then
            echo "already pinned to $DIGEST"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/pin-review-image-${GITHUB_SHA::12}"
          git checkout -B "$BRANCH"
          sed -i "s|goby-review@sha256:[a-f0-9]*|goby-review@${DIGEST##*@}|" "$FILE"
          git diff --quiet "$FILE" && { echo "nothing to pin"; exit 0; }
          git commit -m "ci: pin the reviewer image to ${GITHUB_SHA::12}" "$FILE"
          git push -u origin "$BRANCH"
          # `no-review`: the label exists for changes the reviewer cannot usefully judge, and its own
          # digest is the clearest case.
          gh pr create --title "ci: pin the reviewer image to ${GITHUB_SHA::12}" \
            --body "Published from ${GITHUB_SHA}. One line: the digest the reviewer runs by." \
            --label no-review --base main
          gh pr merge --squash --auto --delete-branch

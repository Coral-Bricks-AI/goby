name: CI

# One job, one Node version. The matrix was two extra minutes to learn what one run already says,
# and the images job belongs with the releases: a pull request does not need to build a container
# to know whether the code typechecks and its tests pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      # typecheck → kernel-checked policies → Node build → offline tests
      - run: bun run check

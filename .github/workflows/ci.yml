name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      # `-e` would abort on the first line of a naive version of this: the expected failure is
      # the point, so the check is written as a case rather than a pipeline and an exit code.
      - name: Bundled entrypoint smoke (no network)
        run: |
          if out=$(node dist/main.js 2>&1); then
            echo "entrypoint succeeded without inputs: $out" >&2; exit 1
          fi
          case "$out" in
            *"INPUT_PR is required"*) ;;
            *) echo "unexpected failure: $out" >&2; exit 1 ;;
          esac

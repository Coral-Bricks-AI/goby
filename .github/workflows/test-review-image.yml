name: test review image

# The reviewer's Dockerfile is otherwise only built by the push to main that publishes it, so a
# broken build — a bad `COPY --from`, a base that no longer has the file it copies — would first
# fail on the branch everyone already runs, and `goby-base:latest` would move while
# `goby-review:latest` did not. Build it on the pull request that changes it instead, the way
# `test-cleaners.yml` does for the cleaners.
#
# Not on push to main: `review-image.yml` already builds these two images on that push, and a
# second build there would only repeat the work.

on:
  pull_request:
    paths:
      - "base/**"
      - "review/**"
      # The reviewer image copies `summarize_run.py` and `timing.py` from here, so a change to
      # either can break the build on a pull request that touches no review file.
      - "common/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-review-image.yml"
      - ".github/workflows/review-image.yml"

concurrency:
  group: test-review-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reviewer has no tests of its own beyond these: `review/entrypoint.sh` is where the agent's
  # two streams and the timing line are wired, and the wiring's failure mode is silence — a review
  # still passes and only stops reporting where its time went. `common/` comes along because
  # `timing.py` is the tool that wiring calls.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - name: Harness tests
        run: python -m pytest -q review common

  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same two builds `review-image.yml` publishes, so a change that breaks publishing breaks
      # here first. Plain `docker build`, not buildx: the reviewer is built `FROM` the base image
      # just built, and a container driver cannot see an image that only exists in the daemon.
      - name: Build goby-base
        run: docker build --platform linux/amd64 -t goby-base:test base

      - name: Build the reviewer
        run: >-
          docker build --platform linux/amd64 --build-arg BASE_IMAGE=goby-base:test
          -f review/Dockerfile -t goby-review:test .

      # A build that succeeds but cannot start is the failure mode that only shows up on the first
      # real review. These are the tools the harness runs on, not a toolchain for the repo under
      # review: if one of them leaves the image, the reviewer cannot start.
      - name: The image can start
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash goby-review:test -lc \
            'pi --version && node --version && python3 --version && git --version && jq --version && rg --version | head -1'

      # `report_findings.ts` is copied as source and loaded by pi at run time, so nothing compiles
      # it: a syntax error would pass every build and then fail every review, because the emit tool
      # the reviewer must call would never be there to call. pi names a file it cannot load, and
      # names the environment variable an extension is missing.
      - name: The emit extension loads
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -e GOBY_MAX_TURNS=50 -e GOBY_MAX_TOOL_CALLS=80 -e GOBY_BASH_TIMEOUT_S=120 \
            -e GOBY_AGENT_OUT=/tmp/agent \
            --entrypoint bash goby-review:test -lc \
              'pi --mode json --extension /opt/goby/report_findings.ts "hi" 2>&1 || true' \
            | grep -Ei 'failed to load extension|is required' || true)"
          if [[ -n "$out" ]]; then echo "$out" >&2; exit 1; fi

      # `prepare` now decides reuse before the clone, so the diff it used to count may not exist
      # yet. A rejected token fails the API call that comes after that read, which makes this
      # deterministic: the failure must be GitHub's, never ENOENT on a file the run is not going to
      # need. A regression here would fail every reuse run and every review with it.
      - name: Preparing does not need the clone
        run: |
          set -euo pipefail
          out="$(docker run --rm \
            -e GOBY_REPO=Coral-Bricks-AI/goby -e GOBY_PR=1 \
            -e GOBY_HEAD=0000000000000000000000000000000000000000 \
            -e GOBY_BASE=1111111111111111111111111111111111111111 \
            -e GOBY_MODEL=m -e GITHUB_TOKEN=not-a-token -e GOBY_OUT=/tmp/out \
            --entrypoint bash goby-review:test -lc \
              'mkdir -p /tmp/out && node /opt/goby/reviewRun.js prepare || true' 2>&1)"
          case "$out" in
            *diff.patch*) echo "prepare still needs the clone: $out" >&2; exit 1 ;;
            *) printf '%s\n' "$out" | head -3 ;;
          esac

      # The timing line is the only way to see inside the agent segment, so a missing file here
      # would be discovered by reading a real review's log weeks later. Run it against a stream
      # that does not exist: it answers instead of failing.
      - name: The timing line runs from inside the image
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint bash goby-review:test -lc \
            'python3 /opt/common/timing.py /nonexistent/events.jsonl --agent-seconds 12')"
          case "$out" in
            *"no event stream"*) echo "$out" ;;
            *) echo "unexpected output: $out" >&2; exit 1 ;;
          esac

      # The image carries the harness, not a toolchain the reviewed repo may need: bun and git-lfs
      # cost every pull and are fetched in the sandbox by the repos that want them (see
      # base/Dockerfile). Bringing either back is a decision a review would take on size, so it
      # should fail with this message and a reason in the pull request, not slip in silently.
      - name: The image is still the harness, not a toolchain
        run: |
          set -euo pipefail
          if found="$(docker run --rm --entrypoint bash goby-review:test -lc 'command -v bun || command -v git-lfs')"; then
            echo "the reviewer image ships $found; a repo that needs it installs it in the sandbox" >&2
            exit 1
          fi

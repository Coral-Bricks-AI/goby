name: Goby cleaners

# Post-merge scanning: a push to main reads every component that push touched and files one
# issue per defect the cleaner could reproduce *and* prove gone after changing the blamed line.
# A component is a directory with an `INVARIANTS.md`; there is no registry to keep in sync.
#
# Two ways to run it, same code:
#
#   **GitHub-hosted runner (default).** Copy this file into your repo, add the model key as a
#   secret. No AWS account, no GitHub App, nothing else. It cannot reach a private network, so
#   a scan sees your code and nothing behind your firewall.
#
#   **Self-hosted runner.** Set `runs-on` (e.g. `[self-hosted, linux]`). The job then runs
#   inside your network, which is the only way a scan can read a private database or an
#   internal service. Install one runner; everything else is unchanged.
#
# Or call it from your own workflow. It runs `:latest` by default, so a client inherits fixes and
# defaults without editing the file; pin a digest only when you need immutable bytes:
#
#   jobs:
#     scan:
#       uses: Coral-Bricks-AI/goby/.github/workflows/cleaners-post-merge.yml@<sha>
#       with:
#         image: ghcr.io/coral-bricks-ai/goby-cleaners@sha256:...   # optional pin
#       secrets:
#         CORALBRICKS_API_KEY: ${{ secrets.CORALBRICKS_API_KEY }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Mirrors the workflow_call inputs, so a manual run can pin what a caller could pin. Empty
    # inputs fall through to the image defaults in cleaners/defaults.env, which is what a push
    # event uses since it has no inputs at all.
    inputs:
      image:
        description: Cleaner image; defaults to :latest, or pin a @sha256 digest.
        type: string
        default: ghcr.io/coral-bricks-ai/goby-cleaners:latest
      runs-on:
        description: Runner label(s); a self-hosted runner is what reaches a private network.
        type: string
        default: ubuntu-latest
      model:
        description: MODEL, in provider/name form.
        type: string
        default: coral/deepseek-v4.1-flash-fast
      fallback-model:
        description: Used when the chosen provider has no key or its call fails.
        type: string
        default: coral/deepseek-v4.1-flash-fast
      max-tools:
        description: Tool calls one scan may make; empty uses the image default.
        type: number
      issues-per-day:
        description: Issues this repo may receive in 24h; empty uses the image default.
        type: number
      max-components:
        description: Components one push may scan; empty uses the image default.
        type: number
      tools:
        description: CLEANERS_TOOLS override; empty uses the image's list.
        type: string
        default: ""
      extensions:
        description: CLEANERS_EXTENSIONS override; comma-separated pi extensions.
        type: string
        default: ""
      tool-key-env:
        description: CLEANERS_TOOL_KEY_ENV; extra credential names a custom tool needs.
        type: string
        default: ""
      label:
        description: Issue label to file under (and to dedupe against).
        type: string
        default: goby-cleaners
  workflow_call:
    inputs:
      image:
        description: Cleaner image; defaults to :latest, or pin a @sha256 digest.
        type: string
        default: ghcr.io/coral-bricks-ai/goby-cleaners:latest
      runs-on:
        description: Runner label(s); a self-hosted runner is what reaches a private network.
        type: string
        default: ubuntu-latest
      model:
        description: MODEL, in provider/name form; the provider picks the credential.
        type: string
        default: coral/deepseek-v4.1-flash-fast
      fallback-model:
        description: Used when the chosen provider has no key or its call fails.
        type: string
        default: coral/deepseek-v4.1-flash-fast
      max-tools:
        description: Tool calls one scan may make; empty uses the image default.
        type: number
      issues-per-day:
        description: Issues this repo may receive in 24h; a high finding is exempt.
        type: number
      max-components:
        description: Components one push may scan; empty uses the image default.
        type: number
      tools:
        description: CLEANERS_TOOLS override; empty uses the image's list.
        type: string
        default: ""
      extensions:
        description: CLEANERS_EXTENSIONS override; comma-separated pi extensions.
        type: string
        default: ""
      tool-key-env:
        description: CLEANERS_TOOL_KEY_ENV; extra credential names a custom tool needs.
        type: string
        default: ""
      label:
        description: Issue label to file under (and to dedupe against).
        type: string
        default: goby-cleaners
    secrets:
      CORALBRICKS_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  issues: write
  # The job runs our published image, and the runner authenticates to ghcr.io with this
  # token before pulling. Without `packages: read` that pull is denied even when the package
  # is public — the runner's login sends a token that does not carry the scope.
  packages: read

# One scan per pushed commit. Not cancelled: a run cancelled halfway can lose a finding that
# was already reproduced, and the next push is a worse retry than finishing this one.
concurrency:
  group: goby-cleaners-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 60
    container:
      image: ${{ inputs.image || 'ghcr.io/coral-bricks-ai/goby-cleaners:latest' }}
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BEFORE: ${{ github.event.before }}
      MODEL: ${{ inputs.model || 'coral/deepseek-v4.1-flash-fast' }}
      FALLBACK_MODEL: ${{ inputs.fallback-model || 'coral/deepseek-v4.1-flash-fast' }}
      MAX_TOOLS: ${{ inputs.max-tools }}
      ISSUES_PER_DAY: ${{ inputs.issues-per-day }}
      MAX_COMPONENTS: ${{ inputs.max-components }}
      CLEANERS_TOOLS: ${{ inputs.tools }}
      CLEANERS_EXTENSIONS: ${{ inputs.extensions }}
      CLEANERS_TOOL_KEY_ENV: ${{ inputs.tool-key-env }}
      CLEANERS_LABEL: ${{ inputs.label || 'goby-cleaners' }}
    steps:
      # The image clones, scans and files; the step is one line because there is nothing for
      # the runner to set up. Nothing from the pushed tree is executed by the runner itself.
      #
      # Secrets are step-scoped, never job-scoped: a job-level env becomes part of the
      # container's own environment, and these belong to the one process that needs them. The
      # entrypoint then moves the token to a root-only file and gives the scan an empty
      # environment, so neither reaches the agent's shell.
      - name: Scan
        working-directory: /workspace
        env:
          CORALBRICKS_API_KEY: ${{ secrets.CORALBRICKS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash /opt/cleaners/entrypoint.sh

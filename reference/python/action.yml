# Frozen pre-port source action, retained only for Python reference tests.
name: goby review (Python reference)
runs:
  using: composite
  steps:
    - name: Review or refresh gate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GOBY_PROVIDER: ${{ inputs.provider }}
        GOBY_MAX_TOOL_TURNS: ${{ inputs.max-tool-turns }}
        GOBY_WALL_TIMEOUT: ${{ inputs.wall-timeout }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_PR: ${{ inputs.pr-number }}
        INPUT_HEAD: ${{ inputs.expected-head }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL: ${{ inputs.fail-on-blocked }}
        PYTHONSAFEPATH: "1"
        PYTHONNOUSERSITE: "1"
      run: |
        set -euo pipefail
        [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr-number must be a positive integer" >&2; exit 2; }
        args=("$INPUT_MODE" --pr "$INPUT_PR")
        [ -z "$INPUT_HEAD" ] || args+=(--expected-head "$INPUT_HEAD")
        case "$INPUT_MODE" in
          review)
            args+=(--agent --provider "$GOBY_PROVIDER")
            [ -z "$INPUT_MODEL" ] || args+=(--model "$INPUT_MODEL")
            [ -z "$INPUT_BASE_URL" ] || args+=(--base-url "$INPUT_BASE_URL")
            case "$INPUT_FAIL" in
              true) args+=(--fail-on-blocked) ;;
              false) ;;
              *) echo "fail-on-blocked must be true or false" >&2; exit 2 ;;
            esac
            ;;
          gate) ;;
          *) echo "mode must be review or gate" >&2; exit 2 ;;
        esac
        PYTHONPATH="$ACTION_PATH/src" python -m goby.cli "${args[@]}"

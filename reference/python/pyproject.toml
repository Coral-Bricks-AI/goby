[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution is `goby-review` because `goby` is taken; the import
# package and the console command are both `goby`. Nothing to publish yet —
# publishing is a deliberate step (see README, "Status").
name = "goby-review"
dynamic = ["version"]
description = "AI code review that reads the code before it comments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goby = "goby.cli:main"

[project.urls]
Homepage = "https://github.com/Coral-Bricks-AI/goby"

[tool.setuptools.dynamic]
version = { attr = "goby.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
